<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Schemes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0c10;
            --text: #d7dbe3;
            --dim: #8b93a5;
            --line: #232733;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 "JetBrains Mono", ui-monospace, monospace;
        }

        /* The simulation draws every tile into this one canvas */
        #fluid-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 24px;
            border-bottom: 1px solid var(--line);
            z-index: 2;
        }

        h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-right: auto;
        }

        label {
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select,
        input[type=range] {
            font: inherit;
            color: var(--text);
            background: #151821;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 3px 6px;
        }

        input[type=range] {
            padding: 0;
            width: 140px;
            accent-color: #e3580e;
        }

        output {
            color: var(--text);
            min-width: 3.5em;
        }

        .tile-label {
            position: fixed;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 22px;
            white-space: nowrap;
            overflow: hidden;
            z-index: 2;
        }

        .tile-label .swatch {
            flex: 0 0 72px;
            height: 6px;
            border-radius: 3px;
        }

        .tile-label .name {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 760px) {
            header {
                height: auto;
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px 16px;
            }

            h1 {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>
    <canvas id="fluid-canvas"></canvas>

    <header>
        <h1>Fire schemes</h1>
        <label>Fire <select id="scene"></select></label>
        <label>View
            <select id="view">
                <option value="actual">Actual size</option>
                <option value="whole">Whole scene</option>
            </select>
        </label>
        <label>Cell <input type="range" id="cell" min="1" max="12" step="0.5" value="3"><output id="cell-value">3px</output></label>
    </header>

    <div id="labels"></div>

    <script type="module" src="./main.js"></script>
</body>

</html>
